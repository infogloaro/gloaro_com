name: Deploy Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gloaro-frontend-production
  cancel-in-progress: true

env:
  VITE_API_BASE_URL: https://api.gloaro.com/api/v1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.html

      - name: Prepare SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/gloaro_deploy
          chmod 600 ~/.ssh/gloaro_deploy
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy build to EC2
        run: |
          set -euo pipefail
          rsync -az --delete \
            -e "ssh -i ~/.ssh/gloaro_deploy" \
            dist/ \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/gloaro/frontend/"

      - name: Verify deployment on EC2
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/gloaro_deploy \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            'test -f /var/www/gloaro/frontend/index.html'

      - name: Verify live site
        run: curl --fail --silent --show-error https://www.gloaro.com/ >/dev/null
